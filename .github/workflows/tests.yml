name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e902d0a3d3c5f # v5
        with:
          python-version: "3.11"

      # Canvas state balance: a ctx.restore() without a paired ctx.save() in the
      # node widget pops the graph renderer's own state frame and makes every
      # node drawn afterwards render blank or as a black slab. Counting
      # ctx.save() with grep does not detect it, so this behavioural check is a
      # required gate. No dependencies, no browser.
      - name: Canvas state balance (node front-end)
        run: node tests/canvas_balance.mjs

      # The same gate for the token graph node: its on-node strip draws on the
      # shared context, and its panel graph must leave its own context balanced.
      - name: Canvas state balance (token graph)
        run: node tests/tg_canvas_balance.mjs

      # Force simulation: determinism, in-bounds placement, hit testing and
      # radius monotonicity. A layout that reshuffles on redraw makes the token
      # under the pointer move away mid-hover.
      - name: Token graph layout
        run: node tests/tg_layout_test.mjs

      # The `exclude` input is a fifty-line multiline widget; left visible it
      # reserves hundreds of pixels and leaves the node body blank. The collapse
      # must zero its height while the panel keeps reading and writing it.
      - name: Exclude widget collapse
        run: node tests/tg_exclude_hidden.mjs

      # The on-node "show graph" button is hit-tested by hand, and draw() and
      # mouse() use different coordinate frames. Getting that wrong renders a
      # perfect button that does nothing when clicked - which is exactly what
      # shipped once, because no test ever called mouse().
      - name: Widget button click
        run: node tests/tg_widget_click.mjs

      # "+ Add row" used to append to a list that renders in windows of 60
      # cards, so the row it created had no card, could not be focused, and sat
      # thousands of pixels below the viewport - the user had to scroll the
      # whole list to reach it. This drives the real dialog and clicks the real
      # button, and also asserts the existing rows keep the # their presets
      # address them by.
      - name: Add row placement
        run: node tests/esn_add_row.mjs

      - name: Node logic
        run: python3 tests/test_nodes.py

      # Token counting: the two counters, co-occurrence weights, exclusions and
      # that a run is recorded exactly once (IS_CHANGED + analyse must not both
      # fold the same run).
      - name: Token graph logic
        run: python3 tests/test_token_graph.py

      # The panel re-ranks the text being typed in the browser, so its
      # tokenizer must agree with the python one; this is what stops drift.
      - name: Tokenizer parity (python vs javascript)
        run: python3 tests/test_token_parity.py
